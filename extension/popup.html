<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; padding: 14px; font-family: Arial, sans-serif; }
    h3 { margin: 0 0 10px; font-size: 15px; }
    label { font-size: 13px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 8px; background: #1a73e8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    #status { font-size: 12px; color: #188038; margin-top: 8px; height: 14px; }
  </style>
</head>
<body>
  <h3>Smart Email Assistant</h3>
  <label for="name">Your name (signature)</label>
  <input id="name" type="text" placeholder="e.g. Soham">
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
